# Developer entry point for `uv run alembic ...`. The app runs migrations itself at start
# (argus.db.migrate), building the same configuration in code.
[alembic]
script_location = backend/argus/migrations
# sqlalchemy.url comes from ARGUS_DB / ARGUS_DATA_DIR (see migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
