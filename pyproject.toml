[project]
name = "argus"
version = "0.1.0"
description = "Local-first portfolio monitor for US stocks & ETFs, built to be operated by AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "exchange-calendars>=4.5",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "mcp>=1.10",
    "alembic>=1.13",
]

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette nags about its own test client transport; not actionable here
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
